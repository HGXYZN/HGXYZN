'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let station={},data={files:[],events:[]},view='channels',chosen=new Date(),month=new Date(chosen.getFullYear(),chosen.getMonth(),1),stream=null,sharing=false,frameUrl='',frameSeq=-1,watching=false,toastTimer,submitAction=null,scanning=false,uploading=false;

const pageIcons={channels:'/channels-section.png',files:'/archive-disk.png',live:'/live-screen.png',calendar:'/calendar.png',pdf:'/convert-pdf.png'};
const pageIcon=id=>'<img class="action-icon" src="'+pageIcons[id]+'" alt="">';
const dtstr=n=>new Date(n*1000).toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'}), shortTime=n=>new Date(n*1000).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}), bytes=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(1)+' GB';

$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,6000)}
async function req(path,method='GET',body=null){let opts={method,cache:'no-store',headers:channelHeaders()};if(body!==null){opts.body=JSON.stringify(body);opts.headers['Content-Type']='application/json'}let r=await fetch('/'+path,opts);if(!r.ok)throw Error((await r.text()).slice(0,350)||'Operazione non riuscita');return r.json()}
function modal(title,html,action,fn,icon=''){$('dt').textContent=title;$('fields').innerHTML=html;$('err').textContent='';$('actions').innerHTML=action?'<button class="primary icon-action" type="submit">'+(icon?'<img class="action-icon" src="'+esc(icon)+'" alt="">':'')+esc(action)+'</button>':'';submitAction=fn;if(!$('dlg').open)$('dlg').showModal()}
$('close').onclick=()=>$('dlg').close();$('form').onsubmit=async e=>{e.preventDefault();let b=$('actions').querySelector('button');if(!submitAction||!b)return;b.disabled=true;try{await submitAction()}catch(e){$('err').textContent=e.message}finally{b.disabled=false}};

let presenceRoom='',presenceSequence=null;
function drawPresence(){
 const panel=$('roomPresence'),list=$('roomPeople');
 panel.hidden=!station.scope;
 const room=(station.scope||'').split('/')[0];
 if(room!==presenceRoom){presenceRoom=room;presenceSequence=null;list.replaceChildren()}
 if(!station.scope)return;
 const presence=station.presence||{people:[],events:[]};
 const events=presence.events||[];
 if(presenceSequence!==null)for(const event of events)if(event.seq>presenceSequence)toast(event.name+' È ENTRATO NELLA STANZA');
 presenceSequence=Math.max(presenceSequence||0,...events.map(e=>e.seq));
 list.innerHTML=(presence.people||[]).map(p=>'<div class="peer-identity"><img class="action-icon" src="/person-busy.png" alt=""><span><strong>'+esc(p.name)+'</strong><br><small>'+(p.online?'COLLEGATO ALLA STANZA':'NON IN LINEA')+'</small></span></div>').join('')||'<span class="muted">AGGIORNAMENTO PARTECIPANTI…</span>';
}

async function loadStation(){
    const next=await req('station');if(next.scope!==station.scope||next.epoch!==station.epoch)data={files:[],events:[]};station=next;$('seat').textContent=station.name;
    syncRoomTools();
    syncInternet();
    $('disconnect').hidden=!(station.mode==='join'&&station.connected);
    if(voiceCall&&voiceCall.scope!==station.scope)stopVoice();else syncVoice();
    if(cameraCall&&cameraCall.scope!==station.scope)stopCamera();else syncCamera();
    $('closeRoom').hidden=!station.host;
    $('closeChannel').hidden=!(station.host&&station.channel);
    $('leaveOffline').hidden=!(station.mode==='join'&&!station.connected);
    badge();drawPeers();drawPresence()
}
async function refresh(){if(!station.scope)return;let scope=station.scope;let next=await req('api/state');if(station.scope!==scope)return;data=next;badge();if(view==='files')fileList();if(view==='calendar')drawCalendar();if(view==='live')liveStatus()}
let joiningRoom=false;
function badge(){
    const waiting=joiningRoom||station.waiting;
    const color=waiting?'orange':!station.connected?'red':station.channel?'purple':'green';
    const src='/net-'+color+'.png';
    if($('networkIcon').getAttribute('src')!==src)$('networkIcon').src=src;
    $('badge').textContent=waiting?'In attesa di autorizzazione':roomBadge()+(station.connected&&station.channel?' / Canale '+station.channel:'');
}

function roomBadge(){
    if(station.host)return 'Ospitante · '+station.name;
    if(station.mode==='join')return (station.connected?'Partecipante · ':'Copia locale · ')+(station.host_name||'Ultima stanza');
    return 'Nessun ruolo';
}
const peersHeading='<h2 class="section-heading"><img class="action-icon" src="/room-house.png" alt="">Altre postazioni in rete</h2>';
function peerRows(){
    const peers=[...(station.peers||[])].sort((a,b)=>Number(a.available===false)-Number(b.available===false)||Number(b.host)-Number(a.host)||a.name.localeCompare(b.name));
    if(!peers.length)return '<p class="empty">In ascolto sulla rete locale. Apri HGXYZN OFFICE anche sull’altro PC.</p>';
    const roles={host:'Ospitante · 4 canali nella stanza',guest:'Partecipante',idle:'Disponibile · nessun ruolo',legacy:'Versione precedente · aggiorna questo PC'};
    return peers.map(p=>{
        const online=p.available!==false;
        const icon=online&&p.role==='idle'?'/person-available.png':'/person-busy.png';
        const status=online?(p.role==='guest'?'Occupato · collegato a una stanza':roles[p.role]||'Disponibile'):'Non in linea';
        const join=online && p.host && station.mode==='disconnected'?'<button type="button" class="primary" data-join="'+esc(p.id)+'"><img class="action-icon" src="/room-house.png" alt="">Entra nella stanza</button>':'';
        return '<div class="row"><div class="peer-identity"><img class="action-icon" src="'+icon+'" alt=""><div><strong>'+esc(p.name)+'</strong><br><small>'+status+'</small></div></div>'+join+'</div>';
    }).join('');
}
function drawPeers(){
    const list=$('peerList'),results=$('scanPeers');
    if(!list&&!results)return;
    const rows=peerRows();
    for(const target of [list,results]){
        if(!target)continue;
        const html=(target===results && station.peers?.length?peersHeading:'')+rows;
        if(target.dataset.last===html)continue;
        target.innerHTML=html;target.dataset.last=html;
        target.querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>joinRoom(b.dataset.join));
    }
}
async function joinRoom(id){
    if(joiningRoom)return;
    joiningRoom=true;badge();
    modal('Entra nella stanza','<p>In attesa che il PC ospitante accetti la richiesta…</p>',null);
    try{
        await req('setup','POST',{mode:'join',name:station.name,peer:id});
        await loadStation();$('dlg').close();go('channels');
    }catch(e){$('err').textContent=e.message}
    finally{joiningRoom=false;station.waiting=false;badge()}
}
async function selectMode(mode,button){
    button.disabled=true;
    try{await req('setup','POST',{mode,name:station.name});await loadStation();go('channels');if(mode==='host'&&station.host&&!station.note_protected)setNotePassword()}
    catch(e){toast(e.message)}
    finally{button.disabled=false}
}
function channels(){
    const here=station.channel;
    if(station.mode==='disconnected'){
        $('heading').classList.add('room-list-title');
        $('heading').innerHTML='Stanze in rete<img class="action-icon" src="/room-house.png" alt="">';

let internetQrValue='';
function syncInternetQr(link){
 const box=$('internetQr'),canvas=$('internetQrCanvas');
 box.hidden=!link;
 if(!link){internetQrValue='';canvas.width=canvas.height=1;return}
 if(link===internetQrValue)return;
 try{
  const qr=qrcodegen.QrCode.encodeText(link,qrcodegen.QrCode.Ecc.MEDIUM),border=4,scale=6;
  canvas.width=canvas.height=(qr.size+border*2)*scale;
  const ctx=canvas.getContext('2d');ctx.fillStyle='#000000';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#3471ed';
  for(let y=0;y<qr.size;y++)for(let x=0;x<qr.size;x++)if(qr.getModule(x,y))ctx.fillRect((x+border)*scale,(y+border)*scale,scale,scale);
  internetQrValue=link;
 }catch(e){box.hidden=true;internetQrValue=''}
}

function dropArea(title,button,accept=''){return '<div class="drop" id="drop"><h3>'+title+'</h3><p class="muted">'+(accept?'Trascina qui i documenti o selezionali dal PC.':'Foto, video, audio, archivi e qualsiasi altro file. Trascinali qui o selezionali dal PC.')+'</p><span class="file-action">'+(accept?'':'<img src="/send-files.png" alt="">')+'<button class="primary" id="pick">'+(accept?'':'<img class="action-icon" src="/browse-file.png" alt="">')+button+'</button></span><input type="file" multiple id="inputFiles" hidden accept="'+accept+'"></div><div id="progressBox" hidden><div id="progressText" class="busy"></div><progress id="progress" max="100"></progress></div>'}
const dragHints=new WeakMap();
let dragCapture=null,dragTime=0;
window.addEventListener('dragenter',e=>{
    if(!e.dataTransfer.types.includes('Files'))return;
    if(!dragCapture||performance.now()-dragTime>1500)dragCapture=req('drag-source','POST',{}).catch(()=>null);
    dragTime=performance.now();
},true);
window.addEventListener('drop',e=>{
    const uris=e.dataTransfer.getData('text/uri-list').split(/\r?\n/).filter(u=>u.startsWith('file:///'));
    for(const file of e.dataTransfer.files){
        const uri=uris.find(u=>{try{return decodeURIComponent(new URL(u).pathname).split('/').pop()===file.name}catch{return false}});
        dragHints.set(file,{capture:dragCapture,uri});
    }
    dragCapture=null;
},true);
function bindDrop(process){let d=$('drop'),i=$('inputFiles');$('pick').onclick=()=>i.click();i.onchange=()=>{process([...i.files]);i.value=''};d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');d.ondrop=e=>{e.preventDefault();d.classList.remove('over');process([...e.dataTransfer.files])}}

function isPdf(file){return /\.pdf$/i.test(file.name)}
function pdfName(file){
    return file.name.replace(/\.[^.]+$/,'')+(isPdf(file)?' - rasterizzato.pdf':'.pdf')
}
function askFile(file){
    return new Promise(resolve=>{
        const dialog=$('dlg');
        const question=isPdf(file)?'Vuoi rasterizzare il PDF?':'Vuoi convertire il documento in PDF?';
        modal(question,'<p class="muted">'+esc(file.name)+'</p>',null);
        $('actions').innerHTML='<button type="button" id="asPdf" class="primary">Sì</button><button type="button" id="asIs">No</button>';
        let answer=null;
        function closed(){
            if(dialog.open)return;
            dialog.removeEventListener('close',closed);
            resolve(answer)
        }
        dialog.addEventListener('close',closed);
        $('asPdf').onclick=()=>{answer=true;dialog.close()};
        $('asIs').onclick=()=>{answer=false;dialog.close()};
    })
}
function uploadFile(path,file,channel,label,bar,scope,destination){
    return new Promise((resolve,reject)=>{
        const x=new XMLHttpRequest();
        x.open('POST','/'+path+'?name='+encodeURIComponent(file.name)+(destination?'&destination='+encodeURIComponent(destination):''));
        if(path==='api/files'){x.setRequestHeader('X-Expected-Channel',String(channel));x.setRequestHeader('X-Expected-Scope',scope)}
        x.responseType='blob';
        bar.value=0;
        x.upload.onprogress=e=>{if(e.lengthComputable)bar.value=e.loaded/e.total*100};
        x.upload.onload=()=>{bar.removeAttribute('value');label.textContent=(path==='pdf'?(isPdf(file)?'Rasterizzazione':'Conversione'):'Salvataggio · '+area())+' · '+file.name};
        x.onerror=()=>reject(Error('Collegamento interrotto. Riprova.'));
        x.onload=async()=>{if(x.status!==200){reject(Error((await x.response.text()).slice(0,300)));return}resolve(x.response)};
        x.send(file)
    })
}
async function processFiles(list,localOnly){
    if(!list.length)return;
    if(uploading){toast('Attendi la fine del trasferimento in corso.');return}
    uploading=true;
    const channel=station.channel||'0',scope=station.scope,box=$('progressBox'),label=$('progressText'),bar=$('progress');
    let done=0,skipped=0;
    box.hidden=false;
    try{
        for(let file of list){
            let destination=null;
            if(!localOnly){
                const hint=dragHints.get(file)||{};
                const ticket=await hint.capture;
                destination=(await req('source-location','POST',{name:file.name,size:file.size,modified:file.lastModified,uri:hint.uri||'',ticket:ticket?.ticket})).destination;
            }
            let convert=false;
            if(officeFile(file)){
                label.textContent=file.name;
                convert=await askFile(file);
                if(convert===null)break;
            }
            if(convert){
                const name=pdfName(file);
                const blob=await uploadFile('pdf',file,channel,label,bar);
                file=new File([blob],name,{type:'application/pdf'});
            }
            if(localOnly){
                if(!convert){skipped++;continue}
                const url=URL.createObjectURL(file),link=document.createElement('a');
                link.href=url;link.download=file.name;link.click();
                setTimeout(()=>URL.revokeObjectURL(url),60000);
            }else{
                label.textContent='Invio · '+file.name;
                await uploadFile('api/files',file,channel,label,bar,scope,destination)
            }
            done++
        }
        if(!localOnly&&done){toast(done===1?'File inviato correttamente':'File inviati correttamente: '+done,true);await refresh()}
        if(localOnly&&(done||skipped))toast('PDF scaricati: '+done+(skipped?' · File saltati: '+skipped:''))
    }catch(e){toast((done?'File completati: '+done+'. ':'')+e.message)}
    finally{uploading=false;box.hidden=true}
}

function calendar(){$('content').innerHTML='<div class="hero"><div><div class="label">Agenda · '+esc(area())+'</div><p id="sync"></p></div><button class="primary" id="addEvent"><img class="action-icon" src="/add-note.png" alt="">Nota o promemoria</button></div><div class="controls local-agenda-actions" id="localAgendaActions" hidden><button class="icon-action" id="openAgenda"><img class="action-icon" src="/calendar-open.png" alt="">Apri cartella locale dei calendari e note</button><button class="icon-action" id="clearAgenda"><img class="action-icon" src="/calendar-clear.png" alt="">Svuota note e calendari</button></div><div class="grid agenda"><div class="card"><div class="flex"><h2 id="month"></h2><div class="controls"><button class="iconbtn" id="prev" aria-label="Mese precedente">‹</button><button class="iconbtn" id="today">Oggi</button><button class="iconbtn" id="next" aria-label="Mese successivo">›</button></div></div><div id="days" class="calendar"></div></div><div class="card"><span class="label">Programma del giorno</span><h2 id="dateLabel"></h2><div id="events"></div></div></div>';$('prev').onclick=()=>shiftMonth(-1);$('next').onclick=()=>shiftMonth(1);$('today').onclick=()=>{chosen=new Date();month=new Date(chosen.getFullYear(),chosen.getMonth(),1);drawCalendar()};$('addEvent').onclick=eventForm;$('openAgenda').onclick=()=>req('agenda/open','POST').catch(e=>toast(e.message));$('clearAgenda').onclick=clearLocalAgenda;if(!station.channel)roomAdminActions($('localAgendaActions'));syncRoomTools();drawCalendar()}
function shiftMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);chosen=new Date(month);drawCalendar()}
function drawCalendar(){if(!$('days'))return;let by={};for(let e of data.events){let k=dayKey(new Date(e.at*1000));(by[k]??=[]).push(e)}let c=dayKey(chosen),now=dayKey(new Date());$('sync').textContent=data.pending?data.pending+' modifiche salvate qui, in attesa di sincronizzazione.':data.online?'Calendario sincronizzato e salvato su questa postazione.':'Copia offline. Le modifiche saranno sincronizzate al rientro in rete.';$('month').textContent=month.toLocaleDateString('it-IT',{month:'long',year:'numeric'});let html=['Lu','Ma','Me','Gi','Ve','Sa','Do'].map(x=>'<b class="wd">'+x+'</b>').join('')+'<span></span>'.repeat((month.getDay()+6)%7);for(let i=1;i<=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();i++){let k=dayKey(new Date(month.getFullYear(),month.getMonth(),i));html+='<button data-day="'+i+'" class="day '+(k===c?'chosen ':'')+(k===now?'today':'')+'">'+i+(by[k]?'<i></i>':'')+'</button>'}$('days').innerHTML=html;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{chosen=new Date(month.getFullYear(),month.getMonth(),+b.dataset.day);drawCalendar()});$('dateLabel').textContent=chosen.toLocaleDateString('it-IT',{day:'numeric',month:'long'});$('events').innerHTML=(by[c]||[]).map(e=>'<div class="row"><div><small>'+shortTime(e.at)+' · '+esc(e.author)+'</small><h3>'+esc(e.title)+'</h3><p class="note">'+esc(e.body)+'</p><small>'+(e.lead<0?'Nota':e.lead===0?'Notifica all’orario indicato':'Notifica '+e.lead+' min prima')+'</small></div><button class="iconbtn" aria-label="Elimina nota" data-del="'+esc(e.id)+'">×</button></div>').join('')||'<p class="empty">Nessuna nota per questa giornata.</p>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteNote(b.dataset.del))}
function eventForm(){let d=new Date(Date.now()+60000);modal('Nota o promemoria','<label>Titolo<input id="et" required maxlength="120" placeholder="Es. Riunione di reparto"></label><label>Data e ora<input id="ed" type="datetime-local" required value="'+dayKey(chosen)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+'"></label><label>Nota<textarea id="eb" rows="3" maxlength="2000"></textarea></label><label>Notifica<select id="el"><option value="-1">Nessuna, solo nota</option><option value="0">All’orario indicato</option>'+[5,15,30,60,1440].map(n=>'<option value="'+n+'">'+(n===1440?'1 giorno':n+' minuti')+' prima</option>').join('')+'</select></label>','Salva nel calendario',async()=>{let when=new Date($('ed').value);await req('api/events','POST',{title:$('et').value,body:$('eb').value,at:when.getTime()/1000,lead:+$('el').value});chosen=when;month=new Date(when.getFullYear(),when.getMonth(),1);$('dlg').close();await refresh();toast(data.pending?'Nota salvata su questo PC.':'Nota salvata · '+area())})}
function live(){$('content').innerHTML='<div class="card"><div class="flex"><h2>Diretta · '+esc(area())+'</h2><span class="chip" id="liveFlag"></span></div><div id="stage"></div><div class="controls"><button class="primary" id="startLive">Condividi schermo o finestra</button><button id="stopLive">Termina diretta</button><button id="full">Schermo intero</button></div><p class="sub" style="margin:12px 0 0">Il browser ti farà scegliere cosa mostrare. La diretta trasmette immagini senza audio.</p></div>';$('startLive').onclick=startLive;$('stopLive').onclick=stopLive;$('full').onclick=()=>$('stage').requestFullscreen().catch(e=>toast(e.message));liveStatus();if(!watching)watch()}
function liveStatus(){if(!$('stage'))return;$('liveFlag').textContent=stream?'Stai trasmettendo':data.live?'In diretta · '+data.live:'Nessuna diretta';$('startLive').hidden=!!stream||!!data.live;$('stopLive').hidden=!stream;if(stream){if(!$('stage').querySelector('video')){let v=document.createElement('video');v.autoplay=v.muted=true;v.srcObject=stream;$('stage').replaceChildren(v)}}else if(!data.live){$('stage').textContent='In attesa di una condivisione';frameSeq=-1}}
async function startLive(){if(sharing)return;try{if(!navigator.mediaDevices?.getDisplayMedia)throw Error('Apri la postazione con Microsoft Edge o Chrome per condividere lo schermo.');stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:{ideal:6,max:8}},audio:false});await req('api/live/start','POST');sharing=true;stream.getVideoTracks()[0].onended=stopLive;let v=document.createElement('video');v.muted=true;v.srcObject=stream;await v.play();liveStatus();let canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');while(sharing&&stream){let scale=Math.min(1,1600/v.videoWidth,1000/v.videoHeight);canvas.width=Math.max(1,Math.round(v.videoWidth*scale));canvas.height=Math.max(1,Math.round(v.videoHeight*scale));ctx.drawImage(v,0,0,canvas.width,canvas.height);let blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.72));if(!sharing)break;let resp=await fetch('/api/live/frame',{method:'POST',headers:channelHeaders(),body:blob});if(!resp.ok)throw Error('Trasmissione interrotta.');await new Promise(r=>setTimeout(r,165))}}catch(e){await stopLive();toast(e.name==='NotAllowedError'?'Condivisione annullata.':e.message)}}
async function stopLive(){let active=sharing;sharing=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(active)await req('api/live/stop','POST').catch(()=>{});if(view==='live')liveStatus()}
async function watch(){watching=true;try{while(view==='live'){if(!stream&&data.live){try{let r=await fetch('/api/live/frame?since='+frameSeq,{cache:'no-store',headers:channelHeaders()});if(r.status===200){let u=URL.createObjectURL(await r.blob());if(view==='live'&&!stream){let img=$('stage').querySelector('img')||document.createElement('img');img.alt='Schermo condiviso';img.src=u;if(!img.parentNode)$('stage').replaceChildren(img);if(frameUrl)URL.revokeObjectURL(frameUrl);frameUrl=u;frameSeq=+r.headers.get('X-Frame')}else URL.revokeObjectURL(u)}}catch{}}await new Promise(r=>setTimeout(r,180))}}finally{watching=false;frameSeq=-1;if(frameUrl){URL.revokeObjectURL(frameUrl);frameUrl=''}}}

let voiceCall=null;
function syncVoice(){
    const button=$('voiceToggle');
    button.hidden=!station.scope;
    button.setAttribute('aria-pressed',voiceCall?.ready?'true':'false');
    button.querySelector('image').setAttribute('href',voiceCall?'/voice-off.png':'/usser3.png');
    button.querySelector('span').textContent=voiceCall?(voiceCall.ready?'Disattiva chat vocale':'Annulla attivazione'):'Attiva chat vocale';
}
function stopVoice(){
    const call=voiceCall;
    voiceCall=null;
    if(call){
        call.mic?.getTracks().forEach(t=>t.stop());
        call.node?.disconnect();call.source?.disconnect();
        if(call.socket)call.socket.close();
        if(call.context&&call.context.state!=='closed')call.context.close().catch(()=>{});
    }
    syncVoice()
}
function playVoice(call,frame){
    if(voiceCall!==call||frame.byteLength!==1936)return;
    const ctx=call.context;
    const sender=Array.from(new Uint8Array(frame,0,16)).join('.');
    const pcm=new Int16Array(frame,16);
    const audio=ctx.createBuffer(1,pcm.length,24000),out=audio.getChannelData(0);
    for(let i=0;i<pcm.length;i++)out[i]=pcm[i]/32768;
    const src=ctx.createBufferSource();src.buffer=audio;src.connect(ctx.destination);
    let when=Math.max(ctx.currentTime+.012,call.next.get(sender)||ctx.currentTime+.07);
    if(when>ctx.currentTime+.30)return;
    src.start(when);call.next.set(sender,when+audio.duration);
}
async function toggleVoice(){
    if(voiceCall){stopVoice();return}
    if(!station.scope)return;
    const call={scope:station.scope,ready:false,next:new Map()};
    voiceCall=call;syncVoice();
    try{
        if(!navigator.mediaDevices?.getUserMedia)throw Error('Il browser non rende disponibile il microfono.');
        call.context=new AudioContext({sampleRate:24000,latencyHint:'interactive'});
        await call.context.resume();
        const mic=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true},video:false});
        if(voiceCall!==call){mic.getTracks().forEach(t=>t.stop());return}
        call.mic=mic;
        await call.context.audioWorklet.addModule('/microphone.js');
        if(voiceCall!==call)return;
        const ws=new WebSocket('ws://'+location.host+'/voice?scope='+encodeURIComponent(call.scope));
        ws.binaryType='arraybuffer';call.socket=ws;
        ws.onclose=()=>{if(voiceCall===call){stopVoice();toast('Chat vocale terminata.')}};
        ws.onmessage=e=>playVoice(call,e.data);
        ws.onopen=()=>{
            if(voiceCall!==call){ws.close();return}
            try{
                call.source=call.context.createMediaStreamSource(mic);
                call.node=new AudioWorkletNode(call.context,'channel-microphone');
                call.node.port.onmessage=e=>{if(ws.readyState===WebSocket.OPEN&&ws.bufferedAmount<12000)ws.send(e.data)};
                call.source.connect(call.node);call.node.connect(call.context.destination);
                mic.getAudioTracks()[0].onended=()=>{if(voiceCall===call)stopVoice()};
                call.ready=true;syncVoice()
            }catch(e){stopVoice();toast('Microfono non disponibile.')}
        };
    }catch(e){
        if(voiceCall===call){stopVoice();toast(e.name==='NotAllowedError'?'Accesso al microfono non consentito.':e.name==='NotFoundError'?'Nessun microfono disponibile.':e.message)}
    }
}
$('voiceToggle').onclick=toggleVoice;

let cameraCall=null;
function syncCamera(){
    const b=$('cameraToggle');b.hidden=!station.scope;
    b.setAttribute('aria-pressed',cameraCall?.ready?'true':'false');
    b.querySelector('span').textContent=cameraCall?(cameraCall.ready?'Spegni videocamera':'Annulla attivazione video'):'Attiva videocamera';
    $('cameraPanel').hidden=!cameraCall?.ready;
}
function stopCamera(){
    const call=cameraCall;cameraCall=null;
    if(call){
        call.mic?.getTracks().forEach(t=>t.stop());
        if(call.socket)call.socket.close();
        if(call.timer)clearTimeout(call.timer);
        for(const tile of call.tiles.values())if(tile.url)URL.revokeObjectURL(tile.url)
    }
    $('cameraTiles').replaceChildren();syncCamera()
}
function cameraTile(call,id,name,local=false){
    if(call.tiles.has(id))return call.tiles.get(id);
    const wrapper=document.createElement('figure'),caption=document.createElement('figcaption');
    const display=document.createElement(local?'video':'img');
    if(local){display.autoplay=display.muted=display.playsInline=true}
    else display.alt='Video del partecipante';
    caption.textContent=name;wrapper.append(display,caption);$('cameraTiles').append(wrapper);
    const tile={wrapper,display,caption,url:null};call.tiles.set(id,tile);return tile
}
function receiveCamera(call,payload){
    if(cameraCall!==call)return;
    if(typeof payload==='string'){
        const members=JSON.parse(payload);
        call.names=members;
        for(const [id,tile] of call.tiles){
            if(id==='self')continue;
            if(!Object.hasOwn(members,id)){tile.wrapper.remove();if(tile.url)URL.revokeObjectURL(tile.url);call.tiles.delete(id)}
            else tile.caption.textContent=members[id]
        }
        return
    }
    if(payload.byteLength<18)return;
    const id=Array.from(new Uint8Array(payload,0,16),b=>b.toString(16).padStart(2,'0')).join('');
    const tile=cameraTile(call,id,call.names[id]||'Partecipante');
    const url=URL.createObjectURL(new Blob([new Uint8Array(payload,16)],{type:'image/jpeg'}));
    tile.display.src=url;if(tile.url)URL.revokeObjectURL(tile.url);tile.url=url
}
async function toggleCamera(){
    if(cameraCall){stopCamera();return}
    if(!station.scope)return;
    const call={scope:station.scope,ready:false,tiles:new Map(),names:{}};
    cameraCall=call;syncCamera();
    try{
        if(!navigator.mediaDevices?.getUserMedia)throw Error('Videocamera non disponibile in questo browser.');
        const media=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},frameRate:{ideal:10,max:15}},audio:false});
        if(cameraCall!==call){media.getTracks().forEach(t=>t.stop());return}
        call.mic=media;
        const ws=new WebSocket('ws://'+location.host+'/camera?scope='+encodeURIComponent(call.scope));
        ws.binaryType='arraybuffer';call.socket=ws;
        ws.onclose=()=>{if(cameraCall===call){stopCamera();toast('Collegamento video terminato.')}};
        ws.onmessage=e=>receiveCamera(call,e.data);
        ws.onopen=async()=>{
            if(cameraCall!==call){ws.close();return}
            call.ready=true;syncCamera();
            const video=cameraTile(call,'self',station.name+' · Tu',true).display;
            video.srcObject=media;
            const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
            async function capture(){
                if(cameraCall!==call||ws.readyState!==WebSocket.OPEN)return;
                try{
                    if(video.readyState>=2&&video.videoWidth&&ws.bufferedAmount<180000){
                        const scale=Math.min(1,640/video.videoWidth,480/video.videoHeight);
                        canvas.width=Math.max(1,Math.round(video.videoWidth*scale));canvas.height=Math.max(1,Math.round(video.videoHeight*scale));
                        ctx.drawImage(video,0,0,canvas.width,canvas.height);
                        const frame=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.72));
                        if(cameraCall===call&&frame&&frame.size<320000&&ws.readyState===WebSocket.OPEN)ws.send(frame)
                    }
                }finally{if(cameraCall===call)call.timer=setTimeout(capture,110)}
            }
            media.getVideoTracks()[0].onended=()=>{if(cameraCall===call)stopCamera()};
            try{await video.play();capture()}catch{if(cameraCall===call){stopCamera();toast('Anteprima della videocamera non disponibile.')}}
        }
    }catch(e){
        if(cameraCall===call){stopCamera();toast(e.name==='NotAllowedError'?'Accesso alla videocamera non consentito.':e.name==='NotFoundError'?'Nessuna videocamera disponibile.':e.message)}
    }
}
$('cameraToggle').onclick=toggleCamera;
